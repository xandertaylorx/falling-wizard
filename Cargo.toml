[package]
name = "falling-wizard"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = { version = "0.4.14", features = ["audio"] }

# Keep `cargo run` fast enough for a 60 FPS falling-sand sim.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
